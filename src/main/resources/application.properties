spring.application.name=family-fantasy-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Dynamic Port Binding for Render
server.port=${PORT:8080}

# Database Connection with Environment Overrides and Local Fallbacks
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/family_fantasy_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Hibernate JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
